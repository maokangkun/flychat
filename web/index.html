<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlyChat · 果蝇脑对话 + 实时 3D</title>
<style>
  html, body { margin:0; padding:0; height:100%; font-family: system-ui,
               -apple-system, "Segoe UI", sans-serif; background:#0d1016;
               color:#dde4ee; overflow:hidden; }
  #app { display:flex; height:100%; }
  #brain-pane { flex: 1 1 55%; position:relative; background:#07090d; min-width:0; }
  #chat-pane { flex: 1 1 45%; max-width:520px; display:flex; flex-direction:column;
               border-left:1px solid #232a38; box-sizing:border-box; min-width:0; }
  #c3d { width:100%; height:100%; display:block; touch-action:none; }
  .hud { position:absolute; left:10px; top:10px; right:10px; z-index:5;
         display:flex; gap:8px; flex-wrap:wrap; pointer-events:none; }
  .hud > * { pointer-events:auto; }
  .chip { background:rgba(13,16,22,.82); border:1px solid #2a3242; border-radius:8px;
          padding:5px 10px; font-size:12px; color:#9db1cc; }
  .chip b { color:#8fb7ff; }
  #btn-wire, #btn-reset { background:rgba(13,16,22,.82); border:1px solid #2a3242;
          color:#9db1cc; border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer; }
  #btn-wire.on, #btn-reset:hover { color:#dde4ee; border-color:#456599; }
  #legend { position:absolute; right:10px; bottom:10px; z-index:5; font-size:11px;
            background:rgba(13,16,22,.82); border:1px solid #2a3242;
            border-radius:8px; padding:6px 10px; color:#9db1cc; }
  /* ---- chat ---- */
  #chat-head { padding:12px 14px 6px; font-size:13px; color:#8fb7ff; }
  #chat-head .muted { color:#8899aa; font-size:11px; }
  #chat { flex:1; overflow-y:auto; padding:8px 12px; min-height:0; }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 10px;
         white-space:pre-wrap; line-height:1.45; font-size:14px; word-break:break-word; }
  .user { background:#27354e; margin-left: 18%; }
  .fly  { background:#1d3326; margin-right: 18%; }
  .meta { color:#7c96b3; font-size:11px; margin-top:2px; }
  form { display:flex; gap:8px; padding:10px 12px; }
  #txt { flex:1; padding:11px 13px; font-size:16px; background:#1a202c;
         color:#dde4ee; border:1px solid #454c5a; border-radius:8px; min-width:0; }
  button { background:#37517e; color:#fff; border:0; border-radius:8px;
           padding: 0 16px; font-size:14px; cursor:pointer; }
  button:hover { background:#456599; }
  button:disabled { background:#2a3140; color:#8899aa; cursor:default; }
  #foot { padding: 0 14px 10px; color:#7c96b3; font-size:11px; }
  /* ---- mobile tabs ---- */
  #tabs { display:none; }
  @media (max-width: 820px) {
    #app { flex-direction:column; }
    #brain-pane { flex:1 1 60%; }
    #chat-pane { flex:1 1 40%; max-width:none; border-left:0;
                 border-top:1px solid #232a38; }
    #tabs { display:flex; position:fixed; left:0; right:0; bottom:0; z-index:20;
            background:#141923; border-top:1px solid #2a3242; }
    #tabs button { flex:1; padding:12px 0; font-size:14px; background:none;
                   border:0; color:#7c96b3; border-radius:0; }
    #tabs button.on { color:#8fb7ff; border-bottom:2px solid #8fb7ff; }
    body.show-chat #brain-pane { display:none; }
    body:not(.show-chat) #chat-pane { display:none; }
    #chat-pane { padding-bottom:44px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="brain-pane">
    <canvas id="c3d"></canvas>
    <div class="hud">
      <span class="chip">🧠 <b id="n-neurons">…</b> 神经元 · 活动 <b id="n-act">0</b></span>
      <button id="btn-wire">加载全脑线框 (LOD2)</button>
      <button id="btn-reset">重置对话</button>
    </div>
    <div id="legend">活动越强颜色越亮（暗灰 → 黄 → 红）</div>
  </div>
  <div id="chat-pane">
    <div id="chat-head">FlyChat · 果蝇脑混合对话
      <div class="muted">MaleCNS v1.0 全图 LIF · 每 token 16 ms 增量仿真 · 移动端点底部标签切换</div>
    </div>
    <div id="chat"></div>
    <form id="f">
      <input id="txt" placeholder="输入一句话，回车发送 …" autocomplete="off">
      <button id="send">发送</button>
    </form>
    <div id="foot">状态：连接中 …</div>
  </div>
</div>
<div id="tabs">
  <button id="tab-brain" class="on" onclick="switchPane(false)">🧠 大脑</button>
  <button id="tab-chat" onclick="switchPane(true)">💬 对话</button>
</div>
<script type="importmap">
{ "imports": { "three": "./js/three.module.min.js" } }
</script>
<!-- v=e4af3f9 -->
<script type="module" src="app.js?v=e4af3fe"></script>
</body>
</html>
