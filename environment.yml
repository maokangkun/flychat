# FlyChat 引擎运行环境 (Python 3.11, CUDA PyTorch)
name: flychat
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch>=2.1
      - transformers>=4.45
      - peft>=0.13
      - accelerate>=1.0
      - safetensors>=0.4
      - numpy>=1.26
      - scipy>=1.11
      - pandas>=2.1
      - pyarrow>=14
      - "huggingface_hub[cli]>=0.25"
